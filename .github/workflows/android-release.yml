name: Android Release

# Builds a signed release APK.
#
# - on a `v*` tag  -> builds, verifies and attaches the APK to a GitHub Release
# - manually       -> builds and uploads the APK as a workflow artifact
#
# Signing material is never committed. Configure these repository secrets:
#   ANDROID_KEYSTORE_BASE64    base64 of the release .keystore file
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias
#   ANDROID_KEY_PASSWORD       key password
# See README -> Android -> Signing for how to produce them.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      app_url:
        description: URL the packaged app should load
        required: false
        type: string
        default: https://agent-mobile.vercel.app

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apk:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "::warning::package-lock.json is not in the repository - falling back to 'npm install'."
            npm install --no-audit --no-fund
          fi

      # The Gradle wrapper JAR and the generated res/ bitmaps are binaries and
      # are not tracked in git (see README -> Android -> Reproducing). Rather
      # than let `./gradlew` die with a confusing "Could not find or load main
      # class GradleWrapperMain", fetch what can be fetched and report exactly
      # what is still missing.
      - name: Ensure the Android project is complete
        run: |
          missing=0

          for f in android/settings.gradle android/build.gradle \
                   android/app/build.gradle android/app/src/main/AndroidManifest.xml; do
            if [ ! -f "$f" ]; then
              echo "::error::Required file $f is missing from the repository."
              missing=1
            fi
          done

          if [ ! -f android/gradlew ]; then
            echo "::error::android/gradlew is missing from the repository."
            missing=1
          else
            chmod +x android/gradlew
          fi

          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar absent; fetching it from the Gradle distribution."
            mkdir -p android/gradle/wrapper
            curl -fsSL -o android/gradle/wrapper/gradle-wrapper.jar \
              https://raw.githubusercontent.com/gradle/gradle/v8.2.1/gradle/wrapper/gradle-wrapper.jar
          fi

          # The launcher icon and splash bitmaps are generated artwork. Without
          # them aapt fails on `@mipmap/ic_launcher`. They are reproducible from
          # assets/ -- but only if assets/icon.png and assets/splash.png are
          # themselves present.
          if [ ! -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png ]; then
            if [ -f assets/icon.png ] && [ -f assets/splash.png ]; then
              echo "Generated res/ bitmaps absent; regenerating from assets/."
              python3 -m pip install --quiet Pillow
              python3 scripts/generate-android-assets.py \
                --icon assets/icon.png --splash assets/splash.png
            else
              echo "::error::The generated Android bitmaps are not in the repository and"
              echo "::error::assets/icon.png + assets/splash.png are missing, so they cannot"
              echo "::error::be regenerated. Commit the binary assets listed in"
              echo "::error::README -> Android -> Reproducing, then re-run this workflow."
              missing=1
            fi
          fi

          [ "$missing" -eq 0 ] || exit 1

      - name: Resolve app URL
        id: appurl
        run: |
          URL="${{ inputs.app_url || 'https://agent-mobile.vercel.app' }}"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Packaging against $URL"

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. See README -> Android -> Signing."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keys/release.keystore"

      - name: Build web app
        env:
          # Placeholders so the build never needs real credentials.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          OPENAI_API_KEY: sk-placeholder
        run: |
          # Next.js inlines NEXT_PUBLIC_* at build time, so the URL has to be
          # present here - not just when Gradle runs.
          export NEXT_PUBLIC_BUILD_APP_URL="${{ steps.appurl.outputs.url }}"
          npm run build

      - name: Sync Capacitor
        env:
          CAPACITOR_APP_URL: ${{ steps.appurl.outputs.url }}
        run: npx cap sync android

      # Bounded parallelism on purpose. A release build derives its worker count
      # from nproc, and on a many-core host that is enough to exceed a 2 GB
      # container cap and take the Gradle daemon down mid-build.
      - name: Build release APK
        working-directory: android
        env:
          # Read by the signingConfig in android/app/build.gradle.
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/keys/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_URL: ${{ steps.appurl.outputs.url }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --no-parallel --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx768m -XX:MaxMetaspaceSize=320m" --stacktrace

      - name: Verify APK signature
        working-directory: android
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "APK: $APK"
          ls -lh "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Stage APK
        run: |
          mkdir -p dist
          SRC=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$SRC" "dist/agent-mobile-${{ github.ref_name }}.apk"
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-mobile-release-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          body: |
            Signed release build of **Agent Mobile**.

            **Install:** transfer the `.apk` to an Android device and open it, or run
            `adb install agent-mobile-${{ github.ref_name }}.apk`.

            Packaged against `${{ steps.appurl.outputs.url }}`.
