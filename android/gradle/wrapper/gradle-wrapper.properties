distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# `-bin` rather than `-all`: the `-all` distribution adds sources and docs that
# a build never reads, and is roughly 60 MB larger to download.
# 8.7 rather than 8.2.1: the workflow builds on JDK 21, and Gradle only gained
# JDK 21 support in 8.5. AGP 8.2.1 requires Gradle >= 8.2, so 8.7 satisfies it.
distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
networkTimeout=30000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
